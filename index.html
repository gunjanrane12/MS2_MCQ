<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snowflake MCQ Practice</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#1b2733;--mut:#64748b;--bd:#dbe3ec;--pri:#29b5e8;--ok:#16a34a;--okb:#dcfce7;--no:#dc2626;--nob:#fee2e2}
@media(prefers-color-scheme:dark){:root{--bg:#0f1720;--card:#18222e;--tx:#e6edf5;--mut:#94a3b8;--bd:#2b3a4a;--okb:#12341f;--nob:#3b1717}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
.wrap{max-width:780px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
button.pri{background:var(--pri);border-color:var(--pri);color:#04202b;font-weight:600}
button:disabled{opacity:.45;cursor:default}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--pri);width:0}
.meta{color:var(--mut);font-size:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
.q{font-size:18px;font-weight:600;margin:10px 0 14px}
.opt{display:flex;gap:10px;width:100%;text-align:left;margin-bottom:8px;padding:12px;border-radius:10px}
.opt b{min-width:22px}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.no{background:var(--nob);border-color:var(--no)}
.exp{margin-top:10px;padding:12px;border-left:4px solid var(--pri);background:var(--bg);border-radius:6px;display:none}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;background:var(--bd)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.grid button{padding:6px 0;font-size:13px}.grid .c{background:var(--okb);border-color:var(--ok)}.grid .w{background:var(--nob);border-color:var(--no)}.grid .cur{outline:2px solid var(--pri)}
.score{font-size:40px;font-weight:700;text-align:center}
.hide{display:none}
</style></head><body><div class="wrap">
<h1>❄️ Snowflake MCQ Practice</h1>
<div id="setup" class="card">
 <div class="row">
  <label>Section <select id="sec"><option value="">All (400)</option><option value="1">Milestone 2 (200)</option><option value="2">Advanced Concepts (200)</option></select></label>
  <label>Difficulty <select id="diff"><option value="">All</option><option>Easy</option><option>Medium</option><option>Hard</option></select></label>
  <label>Order <select id="ord"><option value="seq">In order</option><option value="rnd">Shuffled</option></select></label>
  <label>Count <select id="cnt"><option value="0">All</option><option>10</option><option>25</option><option>50</option><option>100</option><option>200</option></select></label>
  <button class="pri" onclick="start()">Start</button>
 </div>
 <p class="meta" id="info"></p>
</div>
<div id="quiz" class="hide">
 <div class="card">
  <div class="meta"><span id="pos"></span><span id="sc"></span></div>
  <div class="bar"><i id="pb"></i></div>
  <div class="meta"><span id="qn"></span><span class="tag" id="df"></span></div>
  <div class="q" id="qt"></div>
  <div id="opts"></div>
  <div class="exp" id="exp"></div>
  <div class="row" style="margin-top:14px">
   <button onclick="go(-1)" id="prev">← Prev</button>
   <button class="pri" onclick="go(1)" id="next">Next →</button>
   <button onclick="finish()" style="margin-left:auto">Finish</button>
  </div>
 </div>
 <div class="card"><div class="meta" style="margin-bottom:8px">Jump to question</div><div class="grid" id="grid"></div></div>
</div>
<div id="res" class="card hide">
 <div class="score" id="final"></div><p class="meta" id="fsub" style="justify-content:center"></p>
 <div class="row" style="justify-content:center"><button class="pri" onclick="start()">Restart</button><button onclick="retryWrong()">Retry wrong ones</button><button onclick="back()">Change settings</button></div>
</div>
</div>
<script>
const ALL=[{"n": 1, "d": "Medium", "q": "The data team at a manufacturing company must test data quality before performing the actual load. Which Snowflake feature or command should they select?", "o": ["FORCE = TRUE", "VALIDATION_MODE = 'RETURN_ERRORS'", "ON_ERROR = 'CONTINUE'", "PURGE = TRUE"], "a": 1, "e": "VALIDATION_MODE can inspect load errors without loading the data.", "s": "Part 1: Milestone 2", "m": 2, "id": 1}, {"n": 2, "d": "Easy", "q": "A trainee needs to identify the Snowflake feature that can share live Snowflake data with another Snowflake account without copying it. Which choice is correct?", "o": ["External Data Export", "Secure Data Sharing", "Zero-Copy Cloning", "Account Replication"], "a": 1, "e": "Secure Data Sharing exposes live data without copying or exporting it.", "s": "Part 1: Milestone 2", "m": 2, "id": 2}, {"n": 3, "d": "Easy", "q": "For the requirement \"perform the highest-level account administration tasks,\" which Snowflake term is the best fit?", "o": ["SYSADMIN", "SECURITYADMIN", "PUBLIC", "ACCOUNTADMIN"], "a": 3, "e": "ACCOUNTADMIN is Snowflake's highest-level system role and should be used carefully.", "s": "Part 1: Milestone 2", "m": 2, "id": 3}, {"n": 4, "d": "Hard", "q": "During a design review for a banking solution, the team must ensure it can let a partner query provider-controlled data without receiving a physical copy. Which Snowflake option is the strongest architectural fit?", "o": ["External Data Export", "Secure Data Sharing", "Zero-Copy Cloning", "Account Replication"], "a": 1, "e": "Secure Data Sharing exposes live data without copying or exporting it.", "s": "Part 1: Milestone 2", "m": 2, "id": 4}, {"n": 5, "d": "Easy", "q": "For the requirement \"improve micro-partition organization for columns used frequently in selective filters or joins,\" which Snowflake term is the best fit?", "o": ["Resource Monitor", "Stream", "Clustering Key", "Secure View"], "a": 2, "e": "Clustering keys can improve pruning for large tables with suitable access patterns.", "s": "Part 1: Milestone 2", "m": 2, "id": 5}, {"n": 6, "d": "Easy", "q": "Which option best matches this Snowflake responsibility: create and manage warehouses and databases under the standard system hierarchy?", "o": ["PUBLIC", "SYSADMIN", "USERADMIN", "ACCOUNTADMIN"], "a": 1, "e": "SYSADMIN is generally used for warehouses, databases, and related objects.", "s": "Part 1: Milestone 2", "m": 2, "id": 6}, {"n": 7, "d": "Medium", "q": "An architect for a e-commerce system has one key requirement: validate or analyze text length. Which option best satisfies it?", "o": ["COUNT()", "LENGTH()", "SIZE()", "DATE_PART()"], "a": 1, "e": "LENGTH returns a string length.", "s": "Part 1: Milestone 2", "m": 2, "id": 7}, {"n": 8, "d": "Medium", "q": "In a logistics workload, engineers want to manage privileges centrally by job function instead of user-by-user grants. What should they use?", "o": ["Network Policy", "Result Cache", "Clustering Key", "Role-Based Access Control (RBAC)"], "a": 3, "e": "RBAC centralizes privilege management through roles.", "s": "Part 1: Milestone 2", "m": 2, "id": 8}, {"n": 9, "d": "Medium", "q": "In a manufacturing workload, engineers want to select a prior table state using Snowflake Time Travel syntax. What should they use?", "o": ["SINCE", "AT | BEFORE", "VERSION", "AFTER ONLY"], "a": 1, "e": "AT or BEFORE clauses are used for historical Time Travel queries.", "s": "Part 1: Milestone 2", "m": 2, "id": 9}, {"n": 10, "d": "Medium", "q": "An architect for a marketing system has one key requirement: let users submit queries without manually resuming the warehouse first. Which option best satisfies it?", "o": ["Auto-Suspend", "Resource Monitor", "Time Travel", "Auto-Resume"], "a": 3, "e": "Auto-Resume starts compute when work is submitted.", "s": "Part 1: Milestone 2", "m": 2, "id": 10}, {"n": 11, "d": "Hard", "q": "A insurance platform must centralize metadata and coordinate query processing. The team wants the most direct Snowflake mechanism rather than a workaround. Which choice is best?", "o": ["Storage Layer", "Virtual Warehouse", "Services Layer", "External Stage"], "a": 2, "e": "The Services Layer manages metadata, security coordination, parsing, and optimization.", "s": "Part 1: Milestone 2", "m": 2, "id": 11}, {"n": 12, "d": "Medium", "q": "In a insurance workload, engineers want to choose whether COPY stops, continues, or skips files when errors occur. What should they use?", "o": ["SKIP_HEADER", "FORCE", "AUTO_SUSPEND", "ON_ERROR"], "a": 3, "e": "ON_ERROR controls COPY INTO behavior when loading errors are encountered.", "s": "Part 1: Milestone 2", "m": 2, "id": 12}, {"n": 13, "d": "Easy", "q": "For the requirement \"execute SQL from a JavaScript stored procedure,\" which Snowflake term is the best fit?", "o": ["snowflake.query()", "sql.execute()", "snowflake.execute()", "snowflake.run()"], "a": 2, "e": "snowflake.execute() is used to execute SQL in JavaScript stored procedures.", "s": "Part 1: Milestone 2", "m": 2, "id": 13}, {"n": 14, "d": "Easy", "q": "For the requirement \"provide compute resources for query processing,\" which Snowflake term is the best fit?", "o": ["Storage Layer", "Database Schema", "Secure View", "Virtual Warehouse"], "a": 3, "e": "A virtual warehouse supplies compute for queries and data processing.", "s": "Part 1: Milestone 2", "m": 2, "id": 14}, {"n": 15, "d": "Easy", "q": "Which Snowflake concept is primarily used to reduce rows before an expensive join when predicates can be applied early?", "o": ["Use CROSS JOIN first", "Filter Before Joining", "Remove WHERE clauses", "Select every column first"], "a": 1, "e": "Early filtering can reduce join input and improve efficiency.", "s": "Part 1: Milestone 2", "m": 2, "id": 15}, {"n": 16, "d": "Hard", "q": "A supply chain platform must organize related database objects under a new schema. The team wants the most direct Snowflake mechanism rather than a workaround. Which choice is best?", "o": ["CREATE DATABASE", "CREATE TABLE", "CREATE SCHEMA", "ALTER SCHEMA"], "a": 2, "e": "CREATE SCHEMA creates a schema.", "s": "Part 1: Milestone 2", "m": 2, "id": 16}, {"n": 17, "d": "Hard", "q": "A banking team is troubleshooting a design. The required outcome is to share selected data while reducing visibility into the underlying view definition, but the current approach does not provide that behavior. Which option should replace the current approach?", "o": ["Materialized View", "External Table", "Secure View", "Temporary View"], "a": 2, "e": "Secure views help protect view definitions while exposing governed results.", "s": "Part 1: Milestone 2", "m": 2, "id": 17}, {"n": 18, "d": "Easy", "q": "Which option best matches this Snowflake responsibility: extract the month component from a date or timestamp?", "o": ["DATE_PART('month', date_col)", "LENGTH(date_col)", "COALESCE(date_col)", "COUNT(date_col)"], "a": 0, "e": "DATE_PART can extract a requested date/time part such as month.", "s": "Part 1: Milestone 2", "m": 2, "id": 18}, {"n": 19, "d": "Easy", "q": "Which Snowflake concept is primarily used to query or restore historical table data within the retention period?", "o": ["Result Cache", "Time Travel", "Account Replication", "Secure Data Sharing"], "a": 1, "e": "Time Travel provides historical access and recovery within configured retention.", "s": "Part 1: Milestone 2", "m": 2, "id": 19}, {"n": 20, "d": "Hard", "q": "A logistics platform must load files soon after they arrive in cloud storage without repeatedly running manual COPY commands. The team wants the most direct Snowflake mechanism rather than a workaround. Which choice is best?", "o": ["Scheduled COPY worksheet", "Secure Data Sharing", "Time Travel", "Snowpipe"], "a": 3, "e": "Snowpipe provides continuous/automated file ingestion.", "s": "Part 1: Milestone 2", "m": 2, "id": 20}, {"n": 21, "d": "Easy", "q": "Which option best matches this Snowflake responsibility: ignore one or more leading rows in delimited source files?", "o": ["SKIP_HEADER", "FIELD_DELIMITER", "TRIM_SPACE", "COMPRESSION"], "a": 0, "e": "SKIP_HEADER specifies how many initial rows to ignore.", "s": "Part 1: Milestone 2", "m": 2, "id": 21}, {"n": 22, "d": "Hard", "q": "A e-commerce team is troubleshooting a design. The required outcome is to apply delimiter, header, compression, and related parsing settings consistently, but the current approach does not provide that behavior. Which option should replace the current approach?", "o": ["WAREHOUSE", "QUERY_TAG", "FILE_FORMAT", "STORAGE_INTEGRATION"], "a": 2, "e": "FILE_FORMAT supplies parsing rules for staged files.", "s": "Part 1: Milestone 2", "m": 2, "id": 22}, {"n": 23, "d": "Easy", "q": "For the requirement \"validate staged data and return loading errors without inserting rows,\" which Snowflake term is the best fit?", "o": ["VALIDATION_MODE = 'RETURN_ERRORS'", "FORCE = TRUE", "ON_ERROR = 'CONTINUE'", "PURGE = TRUE"], "a": 0, "e": "VALIDATION_MODE can inspect load errors without loading the data.", "s": "Part 1: Milestone 2", "m": 2, "id": 23}, {"n": 24, "d": "Hard", "q": "During a design review for a insurance solution, the team must ensure it can run SQL workloads without storing table data inside the compute resource. Which Snowflake option is the strongest architectural fit?", "o": ["Virtual Warehouse", "Storage Layer", "Database Schema", "Secure View"], "a": 0, "e": "A virtual warehouse supplies compute for queries and data processing.", "s": "Part 1: Milestone 2", "m": 2, "id": 24}, {"n": 25, "d": "Easy", "q": "Which option best matches this Snowflake responsibility: identify expensive operators such as joins, scans, and aggregations in Query Profile?", "o": ["Role Graph", "Execution Graph", "Stage Listing", "Account Map"], "a": 1, "e": "The execution graph shows operators and their relationships in a query plan.", "s": "Part 1: Milestone 2", "m": 2, "id": 25}, {"n": 26, "d": "Medium", "q": "A media platform is being redesigned so it can measure record counts in an aggregation. Which choice is most appropriate?", "o": ["COUNT()", "SUM()", "LENGTH()", "TOTAL()"], "a": 0, "e": "COUNT is the standard aggregate for counting rows or values.", "s": "Part 1: Milestone 2", "m": 2, "id": 26}, {"n": 27, "d": "Medium", "q": "A logistics platform is being redesigned so it can capture execution errors and implement controlled handling logic. Which choice is most appropriate?", "o": ["WHEN / THEN", "TRY / CATCH", "ON ERROR DO", "IF / ELSE only"], "a": 1, "e": "JavaScript TRY/CATCH provides exception handling in stored procedures.", "s": "Part 1: Milestone 2", "m": 2, "id": 27}, {"n": 28, "d": "Medium", "q": "In a education workload, engineers want to let a partner query provider-controlled data without receiving a physical copy. What should they use?", "o": ["External Data Export", "Zero-Copy Cloning", "Account Replication", "Secure Data Sharing"], "a": 3, "e": "Secure Data Sharing exposes live data without copying or exporting it.", "s": "Part 1: Milestone 2", "m": 2, "id": 28}, {"n": 29, "d": "Easy", "q": "Which Snowflake concept is primarily used to return rows where the join condition matches on both sides?", "o": ["LEFT JOIN", "CROSS JOIN", "FULL OUTER JOIN", "INNER JOIN"], "a": 3, "e": "INNER JOIN returns matching rows from both inputs.", "s": "Part 1: Milestone 2", "m": 2, "id": 29}, {"n": 30, "d": "Medium", "q": "A travel team needs to retain all primary entities even when optional related data is missing. Which Snowflake option best meets this requirement?", "o": ["INNER JOIN", "LEFT JOIN", "RIGHT JOIN", "CROSS JOIN"], "a": 1, "e": "LEFT JOIN preserves all left-side rows.", "s": "Part 1: Milestone 2", "m": 2, "id": 30}, {"n": 31, "d": "Medium", "q": "The data team at a SaaS company must submit a SQL statement from procedure code. Which Snowflake feature or command should they select?", "o": ["snowflake.query()", "snowflake.execute()", "sql.execute()", "snowflake.run()"], "a": 1, "e": "snowflake.execute() is used to execute SQL in JavaScript stored procedures.", "s": "Part 1: Milestone 2", "m": 2, "id": 31}, {"n": 32, "d": "Medium", "q": "A media team needs to reuse an S3, Azure Blob, or GCS location for data loading. Which Snowflake option best meets this requirement?", "o": ["Internal Stage", "Virtual Warehouse", "External Stage", "Secure View"], "a": 2, "e": "An external stage references files in supported external cloud storage.", "s": "Part 1: Milestone 2", "m": 2, "id": 32}, {"n": 33, "d": "Medium", "q": "A financial services team needs to control unexpected compute spending across warehouses. Which Snowflake option best meets this requirement?", "o": ["Resource Monitor", "Network Policy", "Secure View", "Query Profile"], "a": 0, "e": "Resource monitors govern credit consumption and can trigger notifications or suspension actions.", "s": "Part 1: Milestone 2", "m": 2, "id": 33}, {"n": 34, "d": "Easy", "q": "For the requirement \"define how staged source files should be parsed,\" which Snowflake term is the best fit?", "o": ["WAREHOUSE", "FILE_FORMAT", "QUERY_TAG", "STORAGE_INTEGRATION"], "a": 1, "e": "FILE_FORMAT supplies parsing rules for staged files.", "s": "Part 1: Milestone 2", "m": 2, "id": 34}, {"n": 35, "d": "Hard", "q": "A retail platform must permit Snowpipe or COPY operations to discover and read source objects securely. The team wants the most direct Snowflake mechanism rather than a workaround. Which choice is best?", "o": ["IAM role with DELETE only", "IAM role with GET and LIST permissions", "EC2 instance profile only", "Lambda execution role only"], "a": 1, "e": "For S3 access, Snowflake needs permissions that allow listing and reading the required objects.", "s": "Part 1: Milestone 2", "m": 2, "id": 35}, {"n": 36, "d": "Medium", "q": "The data team at a telecommunications company must judge whether filters are pruning storage effectively. Which Snowflake feature or command should they select?", "o": ["Rows Inserted", "Partitions Scanned", "Credits Remaining", "Roles Evaluated"], "a": 1, "e": "Partitions Scanned indicates the micro-partitions read by a query.", "s": "Part 1: Milestone 2", "m": 2, "id": 36}, {"n": 37, "d": "Easy", "q": "For the requirement \"store semi-structured values such as nested JSON,\" which Snowflake term is the best fit?", "o": ["VARCHAR", "NUMBER", "VARIANT", "BOOLEAN"], "a": 2, "e": "VARIANT is designed to store and query semi-structured data.", "s": "Part 1: Milestone 2", "m": 2, "id": 37}, {"n": 38, "d": "Easy", "q": "Which option best matches this Snowflake responsibility: produce the Cartesian product of two input tables?", "o": ["INNER JOIN", "SELF JOIN", "CROSS JOIN", "LEFT JOIN"], "a": 2, "e": "CROSS JOIN returns all possible row combinations.", "s": "Part 1: Milestone 2", "m": 2, "id": 38}, {"n": 39, "d": "Hard", "q": "During a design review for a digital payments solution, the team must ensure it can persistent storage remains available independently of compute. Which Snowflake option is the strongest architectural fit?", "o": ["Compute Layer", "Storage Layer", "Services Layer", "Virtual Warehouse"], "a": 1, "e": "The Storage Layer persists table data and organizes it into compressed micro-partitions.", "s": "Part 1: Milestone 2", "m": 2, "id": 39}, {"n": 40, "d": "Medium", "q": "A banking platform is being redesigned so it can land evolving JSON structures before extracting selected attributes. Which choice is most appropriate?", "o": ["VARCHAR", "VARIANT", "NUMBER", "BOOLEAN"], "a": 1, "e": "VARIANT is designed to store and query semi-structured data.", "s": "Part 1: Milestone 2", "m": 2, "id": 40}, {"n": 41, "d": "Easy", "q": "Which option best matches this Snowflake responsibility: drop a table only when it exists without raising a missing-object error?", "o": ["DROP TABLE ONLY IF ROWS", "TRUNCATE TABLE IF EXISTS", "DROP TABLE IF EXISTS", "DELETE TABLE IF EXISTS"], "a": 2, "e": "IF EXISTS prevents an error when the target table does not exist.", "s": "Part 1: Milestone 2", "m": 2, "id": 41}, {"n": 42, "d": "Medium", "q": "A financial services team needs to invoke an existing Snowflake stored procedure. Which Snowflake option best meets this requirement?", "o": ["CALL procedure_name()", "EXEC procedure_name", "RUN procedure_name", "SELECT PROCEDURE"], "a": 0, "e": "CALL is used to execute a stored procedure.", "s": "Part 1: Milestone 2", "m": 2, "id": 42}, {"n": 43, "d": "Hard", "q": "A financial services platform must address the built-in table stage for a specific table. The team wants the most direct Snowflake mechanism rather than a workaround. Which choice is best?", "o": ["@~", "@%table_name", "@stage_name", "@database.schema"], "a": 1, "e": "The @%table_name syntax refers to a table stage.", "s": "Part 1: Milestone 2", "m": 2, "id": 43}, {"n": 44, "d": "Medium", "q": "A manufacturing team needs to delete only records that meet a row condition. Which Snowflake option best meets this requirement?", "o": ["DROP TABLE", "TRUNCATE TABLE", "REMOVE FROM", "DELETE FROM"], "a": 3, "e": "DELETE FROM removes qualifying rows.", "s": "Part 1: Milestone 2", "m": 2, "id": 44}, {"n": 45, "d": "Hard", "q": "A manufacturing engineer is asked to meet this constraint: land evolving JSON structures before extracting selected attributes. Which option addresses the constraint with the least unnecessary complexity?", "o": ["VARIANT", "VARCHAR", "NUMBER", "BOOLEAN"], "a": 0, "e": "VARIANT is designed to store and query semi-structured data.", "s": "Part 1: Milestone 2", "m": 2, "id": 45}, {"n": 46, "d": "Easy", "q": "A trainee needs to identify the Snowflake feature that can reuse an eligible prior query result without recomputing it. Which choice is correct?", "o": ["Local Disk Cache", "Clustering Key", "Multi-Cluster Warehouse", "Result Cache"], "a": 3, "e": "The result cache stores eligible query results independently of warehouse local cache.", "s": "Part 1: Milestone 2", "m": 2, "id": 46}, {"n": 47, "d": "Easy", "q": "A trainee needs to iden ing replaces result caching", "Clustering is required for Streamlit", "Clustering should be targeted to tables and columns with demonstrated pruning benefit"], "a": 3, "e": "Clustering is useful when it materially improves pruning for common access patterns, not as a blanket rule.", "s": "Part 2: Advanced Concepts", "m": 2, "id": 370}, {"n": 171, "d": "Hard", "q": "A repeated report query was fast yesterday due to cache reuse but is slow today after source data was refreshed. What is the most plausible reason?", "o": ["The query lost all privileges automatically", "The warehouse cannot use SQL anymore", "Time Travel disabled the cache", "The cached result is no longer eligible because underlying data changed"], "a": 3, "e": "Result cache reuse depends on unchanged relevant data and other eligibility conditions.", "s": "Part 2: Advanced Concepts", "m": 2, "id": 371}, {"n": 172, "d": "Hard", "q": "A company wants development copies of production with minimal initial storage overhead but needs developers to change data independently afterward. Which feature best satisfies both needs?", "o": ["Secure sharing", "Zero-copy cloning", "Snowpipe", "Dynamic tables"], "a": 1, "e": "Zero-copy cloning shares existing storage initially while allowing later independent changes.", "s": "Part 2: Advanced Concepts", "m": 2, "id": 372}, {"n": 173, "d": "Hard", "q": "A developer accidentally overwrites a table at 10:00 AM and the issue is noticed at noon. No external backup is available. Which Snowflake capability should be evaluated first?", "o": ["Snowpipe", "Cortex Search", "Result cache", "Time Travel within the configured retention period"], "a": 3, "e": "Time Travel is designed for accessing earlier table states within retention.", "s": "Part 2: Advanced Concepts", "m": 2, "id": 373}, {"n": 174, "d": "Hard", "q": "An ingestion team loads evolving JSON and later learns that two nested fields drive 90% of filters. Which redesign most directly targets query efficiency?", "o": ["Incr le privileges for performance"], "a": 0, "e": "AI access should remain governed by Snowflake roles and privileges.", "s": "Part 2: Advanced Concepts", "m": 2, "id": 378}, {"n": 179, "d": "Hard", "q": "A dynamic table chain is repeatedly missing its freshness objective because an upstream object is delayed. Which root cause should be investigated first?", "o": ["Browser cache", "Upstream refresh health and dependency sequencing", "Role naming conventions", "Stage file compression"], "a": 1, "e": "Dependent dynamic tables rely on successful upstream refreshes and correct dependency order.", "s": "Part 2: Advanced Concepts", "m": 2, "id": 379}, {"n": 180, "d": "Hard", "q": "A team configures a very aggressive Dynamic Table freshness target and sees credit consumption rise sharply. What trade-off is being exposed?", "o": ["Fresher data reduces compute use automatically", "Fresher derived data requires more frequent compute work", "Target freshness controls only RBAC", "Target freshness affects only storage encryption"], "a": 1, "e": "More frequent refreshes generally require more compute.", "s": "Part 2: Advanced Concepts", "m": 2, "id": 380}, {"n": 181, "d": "Hard", "q": "An architect must choose between Dynamic Tables and Streams+Tasks. The requirement is a maintained derived dataset with minimal custom orchestration. Which is the stronger fit?", "o": ["Streams only", "Tasks only", "Result cache", "Dynamic Tables"], "a": 3, "e": "Dynamic Tables directly maintain derived data based on upstream changes and refresh policy.", "s": "Part 2: Advanced Concepts", "m": 2, "id": 381}, {"n": 182, "d": "Hard", "q": "An architect must choose between Dynamic Tables and Streams+Tasks. The requirement is explicit change capture plus custom procedural processing steps. Which is the stronger fit?", "o": ["Result cache", "Secure sharing", "Zero-copy cloning", "Streams with Tasks"], "a": 3, "e": "Streams capture changes and Tasks orchestrate custom processing logic.", "s": "Part 2: Advan ": "A team wants Snowflake to participate in a lakehouse architecture using an open table format. Which capability from the source is most relevant?", "o": ["Stored procedures", "Streams", "Iceberg tables", "Horizon"], "a": 2, "e": "Snowflake Iceberg tables provide open table format support.", "s": "Part 2: Advanced Concepts", "m": 2, "id": 387}, {"n": 188, "d": "Hard", "q": "An auditor asks for a platform-wide view of data governance and policy visibility, while a performance engineer asks why one query is slow. Which pairing is correct?", "o": ["Query Profile for governance; Horizon for file ingestion", "Horizon for governance; Query Profile for query performance", "Snowpipe for governance; Time Travel for performance", "Streamlit for both"], "a": 1, "e": "Horizon addresses governance visibility, whereas Query Profile addresses query execution behavior.", "s": "Part 2: Advanced Concepts", "m": 2, "id": 388}, {"n": 189, "d": "Hard", "q": "A Snowflake app provides a polished UI but hard-codes authorization in Python. Why is this design weak?", "o": ["It uses too much Time Travel", "It prevents query caching", "It forces multi-cluster scaling", "It bypasses centralized Snowflake RBAC governance"], "a": 3, "e": "Platform roles and privileges should remain the primary authorization mechanism.", "s": "Part 2: Advanced Concepts", "m": 2, "id": 389}, {"n": 190, "d": "Hard", "q": "A Streamlit app triggers expensive queries on every widget interaction. Which improvement is most aligned with the source concepts?", "o": ["Prepare and aggregate only the data needed before visualization", "Increase Time Travel retention", "Create a new role per click", "Disable all caching"], "a": 0, "e": "Efficient data preparation reduces unnecessary processing before visualization.", "s": "Part 2: Advanced Concepts", "m": 2, "id": 390}, {"n": 191, "d": "Hard", "q": "A team wants a visual relationship analysis between two continuous variables after filtering millions of rows. Which workflow i epts", "m": 2, "id": 394}, {"n": 195, "d": "Hard", "q": "A company sees a low amount of returned data but very high scanned bytes. What does this most strongly suggest?", "o": ["Inefficient pruning or overly broad scans", "An RBAC problem", "A Snowpipe event problem", "A Streamlit rendering problem"], "a": 0, "e": "Large scans for small results often indicate pruning or filtering inefficiency.", "s": "Part 2: Advanced Concepts", "m": 2, "id": 395}, {"n": 196, "d": "Hard", "q": "A company wants low-cost idle periods and rapid restart for bursty analytics. Which warehouse configuration pairing best fits?", "o": ["AUTO_SUSPEND with AUTO_RESUME", "Disable suspension and increase size", "Use only a larger cluster count", "Use Time Travel and cloning"], "a": 0, "e": "AUTO_SUSPEND saves idle credits and AUTO_RESUME restarts compute when needed.", "s": "Part 2: Advanced Concepts", "m": 2, "id": 396}, {"n": 197, "d": "Hard", "q": "A company uses separate warehouses for ETL and BI but both still read the same data. Which Snowflake architecture principle makes this possible?", "o": ["Every warehouse stores its own copy", "Data must be replicated per warehouse", "Compute and storage are decoupled", "Only one warehouse can read a table"], "a": 2, "e": "Snowflake separates compute from shared storage.", "s": "Part 2: Advanced Concepts", "m": 2, "id": 397}, {"n": 198, "d": "Hard", "q": "A user wants a single platform for SQL dashboards, Python transformations, interactive apps, and AI-assisted data interaction. Which combination reflects the source scope?", "o": ["Snowpipe + Time Travel only", "Snowsight + Snowpark + Streamlit + Cortex capabilities", "Stages + roles only", "Replication + Fail-safe only"], "a": 1, "e": "The source spans these platform capabilities for analytics, engineering, apps, and AI.", "s": "Part 2: Advanced Concepts", "m": 2, "id": 398}, {"n": 199, "d": "Hard", "q": "A governance lead sees strong RBAC but limited understanding of how data is being accessed across the platform. Which additional capability should be emphasized?", "o": ["Larger warehouses", "More result caching", "Snowflake Horizon governance visibility", "Additional stages"], "a": 2, "e": "Horizon complements access control with governance and usage visibility.", "s": "Part 2: Advanced Concepts", "m": 2, "id": 399}, {"n": 200, "d": "Hard", "q": "A source contains frequent row changes, a transformation must run automatically, and downstream consumers need only processed deltas. Which architecture is most appropriate?", "o": ["Result cache plus cloning", "Stream for change capture plus Tasks for automated processing", "Secure share plus Time Travel", "Iceberg table plus role hierarchy"], "a": 1, "e": "Streams+Tasks provide the source-supported pattern for automated incremental processing.", "s": "Part 2: Advanced Concepts", "m": 2, "id": 400}];
let set=[],ans={},i=0;
document.getElementById('info').textContent=ALL.length+' questions loaded';
function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]]}return a}
function start(pool){
 set=pool||ALL.filter(q=>(!diff.value||q.d===diff.value)&&(!sec.value||q.s.startsWith('Part '+sec.value)));
 if(!pool){if(ord.value==='rnd')shuffle(set=set.slice());const c=+cnt.value;if(c)set=set.slice(0,c)}
 if(!set.length){alert('No questions match');return}
 ans={};i=0;setup.classList.add('hide');res.classList.add('hide');quiz.classList.remove('hide');render()}
function back(){res.classList.add('hide');quiz.classList.add('hide');setup.classList.remove('hide')}
function stats(){let c=0,t=0;set.forEach((q,k)=>{if(k in ans){t++;if(ans[k]===q.a)c++}});return[c,t]}
function render(){
 const q=set[i];pos.textContent=`Question ${i+1} of ${set.length}`;
 qn.textContent='Q'+q.id+' · '+(q.s.startsWith('Part 1')?'Milestone 2':'Advanced Concepts')+' · '+q.m+(q.m>1?' marks':' mark');df.textContent=q.d;qt.textContent=q.q;
 opts.innerHTML='';
 q.o.forEach((o,k)=>{const b=document.createElement('button');b.className='opt';
  b.innerHTML=`<b>${'ABCD'[k]}.</b><span></span>`;b.lastChild.textContent=o;b.onclick=()=>pick(k);opts.appendChild(b)});
 if(i in ans)reveal();else exp.style.display='none';
 prev.disabled=i===0;next.disabled=i===set.length-1;
 const[c,t]=stats();sc.textContent=`Score: ${c}/${t}`;pb.style.width=(t/set.length*100)+'%';
 grid.innerHTML='';set.forEach((x,k)=>{const b=document.createElement('button');b.textContent=k+1;
  b.className=(k in ans?(ans[k]===x.a?'c':'w'):'')+(k===i?' cur':'');b.onclick=()=>{i=k;render()};grid.appendChild(b)})}
function pick(k){if(i in ans)return;ans[i]=k;render()}
function reveal(){const q=set[i];[...opts.children].forEach((b,k)=>{b.disabled=true;
 if(k===q.a)b.classList.add('ok');else if(k===ans[i])b.classList.add('no')});
 exp.style.display='block';exp.innerHTML='<b>'+(ans[i]===q.a?'✅ Correct. ':'❌ Incorrect. ')+'</b>Answer: '+'ABCD'[q.a]+'. '+(q.e||'');}
function go(d){i=Math.max(0,Math.min(set.length-1,i+d));render()}
function finish(){const[c,t]=stats();quiz.classList.add('hide');res.classList.remove('hide');
 final.textContent=`${c} / ${set.length}`;fsub.textContent=`${t} attempted · ${set.length-t} skipped · ${(c/set.length*100).toFixed(0)}% · ${set.reduce((a,q,k)=>a+(ans[k]===q.a?q.m:0),0)}/${set.reduce((a,q)=>a+q.m,0)} marks`}
function retryWrong(){const w=set.filter((q,k)=>ans[k]!==q.a);if(!w.length){alert('Nothing to retry 🎉');return}start(w)}
document.addEventListener('keydown',e=>{if(quiz.classList.contains('hide'))return;
 if('abcd'.includes(e.key.toLowerCase())&&e.key.length===1)pick('abcd'.indexOf(e.key.toLowerCase()));
 if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
</script></body></html>
